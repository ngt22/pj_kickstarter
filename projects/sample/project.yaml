# 案件メタ情報。id はディレクトリ名と同じにする（英小文字・数字・ハイフン）
id: sample
name: サンプル案件
summary: 予約管理Webサービスの新規開発提案（テンプレートの記入例）
status: draft   # draft | proposed | approved | archived
# 以下は表紙に表示する項目（省略可）
client: さくら整体 様
proposed_at: 2026-10-24   # 提案日 YYYY-MM-DD
version: "1.0"
color: brand   # 表紙のキー色: brand | blue | indigo | violet | grape | pink | red | orange | yellow | lime | green | teal | cyan
# 初期の閲覧者（省略可）。新規案件の初回 push 時だけ閲覧権限に追加します。
# 以降の追加・削除はサイトの「閲覧権限」画面（管理者のみ）で行います。
members:
  - you@example.com
# 補足資料（省略可）。表紙と「補足資料」のページに一覧で出ます。クライアントが読むので、名前と説明もクライアント向けに書きます
# links: 画面モック・参考サイトなどの URL。新しいタブで開きます
links:
  - title: 画面モック（Figma）
    url: https://www.figma.com/
    note: 予約から完了までの流れを操作できます（記入例）
  - title: 参考にした予約サイト
    url: https://example.com/
# files: 一緒に渡すファイル（PDF など）。案件ディレクトリに置き（例: attachments/）、1 ファイル 10MB まで。
# push でサイトに送られ、閲覧権限のある人だけが開けます。中身を変えていないファイルは送り直しません
files:
  - path: attachments/service-overview.pdf
    title: サービス概要
    note: 予約管理サービスの機能と導入の流れ（記入例）
# クライアントに見せてはいけない語（社内のあだ名など。省略可）。push 前に原稿から探し、見つかれば止めます。
# サイトには送りません。全案件に共通の禁止語はサイトの「案件の管理」画面で設定します
forbidden_terms: []
